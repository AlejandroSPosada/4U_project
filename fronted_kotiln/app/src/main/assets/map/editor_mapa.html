<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Editor de mapa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="/maplibre-gl.css">
  <style>
    :root { --morado:#7c5cff; --morado-claro:#b3a6ff; --texto:#e9e6f5; }
    html, body { margin:0; height:100%; overflow:hidden; background:#0d0b14;
                 font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #map { position:absolute; inset:0; }
    .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { display:none; } /* sin atribución/escala: lo muestra Compose */

    /* ---- Diagnóstico en pantalla (se oculta solo cuando el mapa carga bien) ---- */
    #diag { position:absolute; left:12px; right:12px; top:38%; z-index:5; pointer-events:none;
            font:12px/1.4 monospace; color:#9d97b5; white-space:pre-wrap; }
    #diag .err { color:#ff8a9b; }

    /* ---- Etiquetas de lugares (capas del MBTiles) ---- */
    .lugar { width:max-content; max-width:110px; text-align:center; pointer-events:none;
             color:#cfc9e8; font-size:12px; line-height:1.15; text-shadow:0 0 4px #000, 0 0 2px #000; }
    body.sin-lugares .lugar { display:none !important; }

    /* ---- Pines de alerta ---- */
    .alerta { cursor:pointer; }
    .alerta .pin { width:36px; height:44px; transform-origin:50% 100%; transition:transform .12s;
                   filter:drop-shadow(0 2px 4px #000a); }
    .alerta svg { width:100%; height:100%; display:block; overflow:visible; }
    .alerta.inactiva { opacity:.4; filter:grayscale(1); }
    .alerta.sel .pin { transform:scale(1.25); filter:drop-shadow(0 0 8px var(--c)); }
    .alerta.mover .pin { transform:scale(1.25); animation:latido 1s ease-in-out infinite alternate; }
    body.sin-alertas .alerta, body.sin-alertas .chip-radio { display:none !important; }
    @keyframes latido { from { filter:drop-shadow(0 0 2px var(--c)); } to { filter:drop-shadow(0 0 12px var(--c)); } }
    @media (prefers-reduced-motion: reduce) { .alerta.mover .pin { animation:none; } }

    .chip-radio { pointer-events:none; padding:3px 10px; border-radius:12px; font-size:12px;
                  color:#fff; background:#141022e6; border:1px solid #ffffff55; white-space:nowrap; }

    /* ---- Posición del admin ("Mi posición"), como .yo de script2.py ---- */
    .yo { width:18px; height:18px; border-radius:50%; box-sizing:border-box;
          background:#fff; border:5px solid var(--morado); box-shadow:0 0 12px var(--morado); }
    .yo::before { content:""; position:absolute; left:-36px; top:-36px; width:90px; height:90px;
          border-radius:50%; background:#7c5cff38; border:1px solid #7c5cff8c;
          animation:pulso 2.4s ease-out infinite; }
    @keyframes pulso { from { transform:scale(.6); opacity:1; } to { transform:scale(1.1); opacity:.25; } }
    @media (prefers-reduced-motion: reduce) { .yo::before { animation:none; } }
  </style>
</head>
<body>
<div id="map"></div>
<div id="diag"></div>
<script>
  window.onerror = function (m, src, l) {
    var d = document.getElementById("diag");
    d.innerHTML += "<div class=err>JS: " + m + " (" + (src || "").split("/").pop() + ":" + l + ")</div>";
  };
</script>
<script src="/maplibre-gl.js"></script>
<script>
  (function () {
    'use strict';
    var A = window.CampusBridge || {};
    var diagEl = document.getElementById('diag');
    var hayError = false;
    function paso(txt) { diagEl.innerHTML += '<div>' + txt + '</div>'; }
    function falla(txt) {
      hayError = true;
      diagEl.innerHTML += '<div class="err">' + txt + '</div>';
      aKotlin('error', txt);
    }
    if (typeof maplibregl === 'undefined') { falla('maplibre-gl.js NO cargó (¿archivo vacío o mal copiado?)'); return; }
    paso('1. maplibre-gl.js cargado');
    function aKotlin(nombre) {
      try { var f = A[nombre]; if (f) f.apply(A, Array.prototype.slice.call(arguments, 1)); } catch (e) {}
    }

    // -------------------------------------------------------------------------
    // Estilo oscuro (portado de construir_estilo() en script2.py)
    // -------------------------------------------------------------------------
    function construirEstilo(meta) {
      var anchoVia = ['interpolate', ['linear'], ['zoom'], 15, 2, 19, 12];
      var anchoViaBorde = ['interpolate', ['linear'], ['zoom'], 15, 3, 19, 15];
      return {
        version: 8,
        name: 'EAFIT oscuro',
        sources: { eafit: { type: 'vector', tiles: [location.origin + '/tiles/{z}/{x}/{y}.pbf'],
                            minzoom: meta.minzoom, maxzoom: meta.maxzoom } },
        layers: [
          { id: 'fondo', type: 'background', paint: { 'background-color': '#181b1a' } },
          { id: 'zonas_verdes', type: 'fill', source: 'eafit', 'source-layer': 'zonas_verdes', paint: { 'fill-color': '#1f3326' } },
          { id: 'agua', type: 'fill', source: 'eafit', 'source-layer': 'agua', paint: { 'fill-color': '#1b3445' } },
          { id: 'canchas', type: 'fill', source: 'eafit', 'source-layer': 'canchas_deportivas', paint: { 'fill-color': '#24443a', 'fill-outline-color': '#35604f' } },
          { id: 'parqueaderos', type: 'fill', source: 'eafit', 'source-layer': 'parqueaderos', paint: { 'fill-color': '#25252b', 'fill-outline-color': '#34343d' } },
          { id: 'cursos_agua', type: 'line', source: 'eafit', 'source-layer': 'cursos_de_agua', paint: { 'line-color': '#1b3445', 'line-width': 2 } },
          { id: 'vias_borde', type: 'line', source: 'eafit', 'source-layer': 'vias', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#2c2b38', 'line-width': anchoViaBorde } },
          { id: 'vias', type: 'line', source: 'eafit', 'source-layer': 'vias', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#101014', 'line-width': anchoVia } },
          { id: 'caminos', type: 'line', source: 'eafit', 'source-layer': 'caminos_peatonales', paint: { 'line-color': '#6a6580', 'line-width': 1.2, 'line-dasharray': [2, 2] } },
          { id: 'edificios', type: 'fill', source: 'eafit', 'source-layer': 'edificios', paint: { 'fill-color': '#33323f', 'fill-outline-color': '#55536a' } },
          { id: 'contorno', type: 'line', source: 'eafit', 'source-layer': 'campus_contorno', paint: { 'line-color': '#7c5cff', 'line-width': 2.5, 'line-dasharray': [3, 2] } }
        ]
      };
    }

    // -------------------------------------------------------------------------
    // Iconos por tipo de alerta (viewBox 24x24, trazo)
    // -------------------------------------------------------------------------
    var ICONOS = {
      AGUA: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
      MOBILIARIO: '<path d="M4 11h16M5 11V8a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M6 11v6M18 11v6M4 15h16"/>',
      ESCALONES: '<path d="M4 19h4v-4h4v-4h4V7h4"/>',
      OBRA: '<path d="M3 20h18M5 20l2-9h10l2 9M9 11l1-4h4l1 4"/>',
      VEHICULOS: '<path d="M4 15v-3l2-5h12l2 5v3zM4 15v3M20 15v3"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/>',
      OTRO: '<path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17v.5"/>'
    };
    var COLOR = { ALTA: '#ff4d6d', NORMAL: '#ffb020' };

    function svgPin(a) {
      var c = COLOR[a.prioridad] || COLOR.NORMAL;
      return '<svg viewBox="0 0 36 44" aria-hidden="true">' +
        '<path d="M18 43C18 43 33 28 33 17A15 15 0 0 0 3 17C3 28 18 43 18 43Z" fill="#1a1226" stroke="' + c + '" stroke-width="2.5"/>' +
        '<g transform="translate(6,5)" fill="none" stroke="' + c + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        (ICONOS[a.tipo] || ICONOS.OTRO) + '</g></svg>';
    }

    // -------------------------------------------------------------------------
    // Estado
    // -------------------------------------------------------------------------
    var map;
    var datos = new Map();      // id -> alerta
    var marcas = new Map();     // id -> { marker, el, pin }
    var seleccionId = null;
    var moverId = null;
    var modoColocar = false;
    var chipRadio = null;
    var marcaUsuario = null;
    var capasPend = null;

    function metrosALat(m) { return m / 111320; }

    function circulo(lat, lng, radio, color) {
      var pts = [], R = 6371008.8, d = radio / R, lat1 = lat * Math.PI / 180, lng1 = lng * Math.PI / 180;
      for (var i = 0; i <= 64; i++) {
        var br = (i / 64) * 2 * Math.PI;
        var lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(br));
        var lng2 = lng1 + Math.atan2(Math.sin(br) * Math.sin(d) * Math.cos(lat1),
                                     Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
        pts.push([lng2 * 180 / Math.PI, lat2 * 180 / Math.PI]);
      }
      return { type: 'Feature', properties: { color: color },
               geometry: { type: 'Polygon', coordinates: [pts] } };
    }

    // -------------------------------------------------------------------------
    // Alertas
    // -------------------------------------------------------------------------
    function crearMarca(a) {
      var el = document.createElement('div');
      el.className = 'alerta';
      var pin = document.createElement('div');
      pin.className = 'pin';
      el.appendChild(pin);
      el.addEventListener('click', function (ev) {
        ev.stopPropagation();
        aKotlin('alertaToque', a.id);
      });
      var marker = new maplibregl.Marker({ element: el, anchor: 'bottom', draggable: false })
        .setLngLat([a.lng, a.lat]).addTo(map);
      marker.on('drag', function () {
        var ll = marker.getLngLat(), d = datos.get(a.id);
        if (d) { d.lat = ll.lat; d.lng = ll.lng; dibujarRadio(); }
      });
      marker.on('dragend', function () {
        var ll = marker.getLngLat();
        aKotlin('alertaMovida', a.id, ll.lat, ll.lng);
      });
      return { marker: marker, el: el, pin: pin };
    }

    function actualizarMarca(m, a) {
      var c = COLOR[a.prioridad] || COLOR.NORMAL;
      m.pin.innerHTML = svgPin(a);
      m.el.style.setProperty('--c', c);
      m.el.classList.toggle('inactiva', !a.activa);
      m.el.classList.toggle('sel', a.id === seleccionId);
      m.el.classList.toggle('mover', a.id === moverId);
      m.el.setAttribute('aria-label', 'Alerta: ' + a.mensaje);
      m.marker.setDraggable(a.id === moverId);
      if (a.id !== moverId) m.marker.setLngLat([a.lng, a.lat]);
    }

    function refrescarMarcas() {
      datos.forEach(function (a, id) {
        var m = marcas.get(id);
        if (m) actualizarMarca(m, a);
      });
    }

    function dibujarRadio() {
      var fuente = map.getSource('radio');
      if (!fuente) return;
      var a = seleccionId ? datos.get(seleccionId) : null;
      if (!a) {
        fuente.setData({ type: 'FeatureCollection', features: [] });
        if (chipRadio) { chipRadio.remove(); chipRadio = null; }
        return;
      }
      var color = COLOR[a.prioridad] || COLOR.NORMAL;
      fuente.setData({ type: 'FeatureCollection', features: [circulo(a.lat, a.lng, a.radio, color)] });
      var sur = [a.lng, a.lat - metrosALat(a.radio)];
      if (!chipRadio) {
        var el = document.createElement('div');
        el.className = 'chip-radio';
        chipRadio = new maplibregl.Marker({ element: el, anchor: 'top' }).setLngLat(sur).addTo(map);
      }
      chipRadio.getElement().textContent = 'Radio: ' + a.radio + ' m';
      chipRadio.setLngLat(sur);
    }

    // -------------------------------------------------------------------------
    // Etiquetas de lugares desde el MBTiles (portado de actualizarMarcadores)
    // -------------------------------------------------------------------------
    var CAPAS = [['puntos_de_interes', 16], ['edificios', 17], ['canchas_deportivas', 17]];
    var etiquetas = new Map();

    function limites(coords, b) {
      if (typeof coords[0] === 'number') {
        b[0] = Math.min(b[0], coords[0]); b[1] = Math.min(b[1], coords[1]);
        b[2] = Math.max(b[2], coords[0]); b[3] = Math.max(b[3], coords[1]);
      } else coords.forEach(function (c) { limites(c, b); });
      return b;
    }

    function actualizarLugares() {
      var z = map.getZoom();
      CAPAS.forEach(function (par) {
        var capa = par[0], zmin = par[1];
        if (z < zmin) return;
        map.querySourceFeatures('eafit', { sourceLayer: capa }).forEach(function (f) {
          var nombre = f.properties && f.properties.name;
          if (!nombre) return;
          var b = limites(f.geometry.coordinates, [Infinity, Infinity, -Infinity, -Infinity]);
          var clave = capa + '|' + nombre;
          var e = etiquetas.get(clave);
          if (!e) {
            var el = document.createElement('div');
            el.className = 'lugar';
            el.textContent = nombre;
            e = { el: el, zmin: zmin, b: b,
                  marker: new maplibregl.Marker({ element: el }).setLngLat([0, 0]).addTo(map) };
            etiquetas.set(clave, e);
          } else {
            e.b = [Math.min(e.b[0], b[0]), Math.min(e.b[1], b[1]), Math.max(e.b[2], b[2]), Math.max(e.b[3], b[3])];
          }
          e.marker.setLngLat([(e.b[0] + e.b[2]) / 2, (e.b[1] + e.b[3]) / 2]);
        });
      });
      visibilidadLugares();
    }

    function visibilidadLugares() {
      var z = map.getZoom();
      etiquetas.forEach(function (e) { e.el.style.display = z >= e.zmin ? '' : 'none'; });
    }

    // -------------------------------------------------------------------------
    // API que llama Kotlin (evaluateJavascript)
    // -------------------------------------------------------------------------
    window.EditorMapa = {
      setAlertas: function (lista) {
        datos = new Map(lista.map(function (a) { return [a.id, a]; }));
        marcas.forEach(function (m, id) {
          if (!datos.has(id)) { m.marker.remove(); marcas.delete(id); }
        });
        lista.forEach(function (a) {
          if (!marcas.has(a.id)) marcas.set(a.id, crearMarca(a));
        });
        refrescarMarcas();
        dibujarRadio();
      },
      setSeleccion: function (id) { seleccionId = id; refrescarMarcas(); dibujarRadio(); },
      setMover: function (id) { moverId = id; refrescarMarcas(); },
      setModoColocar: function (v) {
        modoColocar = !!v;
        map.getCanvas().style.cursor = modoColocar ? 'crosshair' : '';
      },
      setCapas: function (c) {
        if (!map.isStyleLoaded() && !map.getLayer('cobertura')) { capasPend = c; return; }
        document.body.classList.toggle('sin-alertas', !c.alertas);
        document.body.classList.toggle('sin-lugares', !c.lugares);
        map.setLayoutProperty('cobertura', 'visibility', c.cobertura ? 'visible' : 'none');
        map.setLayoutProperty('rutas', 'visibility', c.rutas ? 'visible' : 'none');
      },
      setCobertura: function (fc) { map.getSource('cobertura').setData(fc); },
      setRutas: function (fc) { map.getSource('rutas').setData(fc); },
      setUsuario: function (lat, lng) {
        if (lat === null) { if (marcaUsuario) { marcaUsuario.remove(); marcaUsuario = null; } return; }
        if (!marcaUsuario) {
          var el = document.createElement('div');
          el.className = 'yo';
          marcaUsuario = new maplibregl.Marker({ element: el });
        }
        marcaUsuario.setLngLat([lng, lat]).addTo(map);
      },
      centrar: function (lat, lng, zoom) {
        map.easeTo({ center: [lng, lat], zoom: zoom || Math.max(map.getZoom(), 18), duration: 500 });
      },
      zoom: function (delta) { map.easeTo({ zoom: map.getZoom() + delta, duration: 250 }); }
    };

    // -------------------------------------------------------------------------
    // Arranque
    // -------------------------------------------------------------------------
    fetch('/meta.json').then(function (r) { return r.json(); }).then(function (meta) {
      var b = meta.bounds;
      paso('2. meta.json ok: zoom ' + meta.minzoom + '-' + meta.maxzoom + ', bounds ' + b.join(', '));
      map = new maplibregl.Map({
        container: 'map',
        style: construirEstilo(meta),
        bounds: [[b[0], b[1]], [b[2], b[3]]],
        fitBoundsOptions: { padding: 20 },
        maxZoom: 21,
        attributionControl: false
      });

      map.on('load', function () {
        paso('3. estilo cargado');
        var vacio = { type: 'FeatureCollection', features: [] };
        map.addSource('radio', { type: 'geojson', data: vacio });
        map.addLayer({ id: 'radio-fill', type: 'fill', source: 'radio',
                       paint: { 'fill-color': ['get', 'color'], 'fill-opacity': 0.18 } });
        map.addLayer({ id: 'radio-line', type: 'line', source: 'radio',
                       paint: { 'line-color': ['get', 'color'], 'line-width': 2, 'line-dasharray': [2, 2] } });

        // Capas que dependen de datos aún no disponibles (dataset de fotos / grafo de caminos)
        map.addSource('cobertura', { type: 'geojson', data: vacio });
        map.addLayer({ id: 'cobertura', type: 'circle', source: 'cobertura', layout: { visibility: 'none' },
                       paint: { 'circle-radius': 4, 'circle-color': '#7c5cff', 'circle-opacity': 0.7,
                                'circle-stroke-color': '#b3a6ff', 'circle-stroke-width': 1 } });
        map.addSource('rutas', { type: 'geojson', data: vacio });
        map.addLayer({ id: 'rutas', type: 'line', source: 'rutas', layout: { visibility: 'none' },
                       paint: { 'line-color': '#4da3ff', 'line-width': 3 } });

        if (capasPend) { window.EditorMapa.setCapas(capasPend); capasPend = null; }
        aKotlin('listo');
      });

      map.on('idle', function () {
        if (!hayError) diagEl.style.display = 'none';
        actualizarLugares();
      });
      map.on('zoom', visibilidadLugares);

      // Toque en el mapa vacío (los marcadores detienen su propio click)
      map.on('click', function (e) {
        if (e.originalEvent.target.closest('.maplibregl-marker')) return;
        aKotlin('mapaToque', e.lngLat.lat, e.lngLat.lng);
      });

      map.on('error', function (e) {
        falla('mapa: ' + String((e && e.error && e.error.message) || e));
      });
    }).catch(function (e) { falla('meta.json: ' + e); });
  })();
</script>
</body>
</html>
