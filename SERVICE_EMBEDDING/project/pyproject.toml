[project]
name = "campus-locator-embedding"
version = "0.1.0"
description = "Servicio interno de embeddings (DINOv2 ViT-S/14 en CPU) de Campus Locator"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    # PyTorch para CPU desde su índice propio (ver [tool.uv.sources]): evita CUDA y >1 GB de imagen.
    "torch>=2.5,<3",
    "transformers>=4.46,<6",
    "huggingface-hub>=0.26,<3",
    "numpy>=2,<3",
    # Decodificación y redimensión de pp-v1 (ARCHITECTURE §5.3).
    "pillow>=12.3,<14",
    # Lectura de multipart/form-data en POST /v1/embed (§5.2).
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
# `uv sync` instala `dev` por defecto; la imagen usa `--no-dev`.
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.7",
]
# Validadores de los lotes EMB-x.y (src/ops/, contrato de infra §5.11).
ops = [
    "boto3>=1.35",
    "httpx>=0.27",
]

[tool.uv]
# No se instala como paquete: la imagen copia src/app como paquete `app` (ARCHITECTURE §5.5).
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Textos en español con «», ×, – en mensajes y comentarios.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "comun"]
