# CI/CD del backend (BACKEND_FASTAPI). Contrato: INFRASTRUCTURA_TERRAFORM/docs/ARCHITECTURE.md §3.9, §5.8 y §5.9;
# lo propio del backend: BACKEND_FASTAPI/docs/ARCHITECTURE.md §4.2 y §5.9 (lote BE-1.1).
# - Pull request: lint y pruebas.
# - Push a main: lint y pruebas → imagen linux/amd64 con etiqueta = SHA → ECR → nuevas revisiones de
#   campus-locator-dev-api y campus-locator-dev-worker → update-service de ambos (api pasa a 1 réplica en el primer
#   despliegue) → wait services-stable sobre api y comprobación de que no hubo rollback.
#   El paso migrate (infra §5.9, paso 2) llega con BE-1.2.
# Para volver a desplegar el mismo commit (p. ej. tras un cambio de Terraform en una tarea, ADR-INF-09): «Re-run all
# jobs» en la última ejecución de main. Así la imagen sigue siendo la del último commit que tocó project/ (BE-1.1 C3a).
name: backend

on:
  pull_request:
    paths:
      - "BACKEND_FASTAPI/project/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "BACKEND_FASTAPI/project/**"
      - ".github/workflows/backend.yml"

permissions: {}

# Un PR solo necesita su última ejecución; los despliegues de main van en fila y no se interrumpen.
concurrency:
  group: backend-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CUENTA_AWS: "648617469176"
  # La misma versión de uv que copia project/Dockerfile.
  UV_VERSION: "0.11.32"
  # Nombres de infra §5.1.
  SERVICIO_API: api
  SERVICIO_WORKER: worker
  FAMILIA_API: campus-locator-dev-api
  FAMILIA_WORKER: campus-locator-dev-worker
  CONTENEDOR: app

defaults:
  run:
    shell: bash
    working-directory: BACKEND_FASTAPI/project

jobs:
  pruebas:
    name: lint y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: BACKEND_FASTAPI/project/uv.lock

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: ruff check
        run: uv run --frozen ruff check .

      - name: ruff format --check
        run: uv run --frozen ruff format --check .

      - name: pytest
        run: uv run --frozen pytest

  desplegar:
    name: despliegue (main)
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Sin `environment:`: el rol gha-deploy solo confía en sub = repo:<sub_repo>:ref:refs/heads/main (infra §5.8); con
    # un entorno el sub cambiaría y AWS rechazaría el token.
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_BACKEND: ${{ vars.ECR_BACKEND }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ROL_DEPLOY: ${{ vars.AWS_ROL_DEPLOY_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar las variables del repositorio (infra §5.9)
        run: |
          faltan=""
          for v in AWS_REGION ECR_BACKEND ECS_CLUSTER ROL_DEPLOY; do
            [ -n "${!v}" ] || faltan="$faltan $v"
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan variables del repositorio:$faltan (ROL_DEPLOY = AWS_ROL_DEPLOY_ARN; infra §5.9)"
            exit 1
          fi
          echo "IMAGEN=${ECR_BACKEND}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Credenciales de AWS (gha-deploy)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROL_DEPLOY_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: backend-deploy-${{ github.run_id }}
          allowed-account-ids: ${{ env.CUENTA_AWS }}

      - name: Construir y publicar la imagen
        run: |
          registro="${ECR_BACKEND%%/*}"
          repositorio="${ECR_BACKEND#*/}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registro"
          existentes=$(aws ecr batch-get-image --repository-name "$repositorio" \
            --image-ids imageTag="$GITHUB_SHA" --query 'length(images)' --output text)
          if [ "$existentes" != "0" ]; then
            echo "La imagen $IMAGEN ya está en ECR (etiquetas inmutables): no se vuelve a publicar."
            exit 0
          fi
          docker build --platform linux/amd64 --build-arg GIT_COMMIT="$GITHUB_SHA" -t "$IMAGEN" .
          docker push "$IMAGEN"

      # BE-1.2: aquí va el paso migrate (infra §5.9, paso 2): revisión nueva de campus-locator-dev-migrate, run-task en
      # SUBREDES_TAREAS con SG_MIGRATE e IP pública, esperar STOPPED y fallar si el contenedor app no sale con 0.

      - name: Registrar las nuevas revisiones de api y worker
        id: revisiones
        run: |
          # Parte de la última revisión de cada familia (la de Terraform o la del despliegue anterior) y solo cambia
          # la imagen del contenedor app; el comando de worker y el resto de la tarea se conservan (backend §4.2).
          shopt -s inherit_errexit
          registrar() {
            local familia="$1" actual="$RUNNER_TEMP/$1-actual.json" nueva="$RUNNER_TEMP/$1-nueva.json"
            aws ecs describe-task-definition --task-definition "$familia" \
              --query taskDefinition --output json > "$actual"
            if ! jq -e --arg c "$CONTENEDOR" 'any(.containerDefinitions[]; .name == $c)' "$actual" > /dev/null; then
              echo "::error::$familia no tiene un contenedor $CONTENEDOR" >&2
              return 1
            fi
            jq --arg img "$IMAGEN" --arg c "$CONTENEDOR" '
                .containerDefinitions |= map(if .name == $c then .image = $img else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt, .deleteRequestedAt)' "$actual" > "$nueva"
            aws ecs register-task-definition --cli-input-json "file://$nueva" \
              --query taskDefinition.taskDefinitionArn --output text
          }
          api=$(registrar "$FAMILIA_API")
          worker=$(registrar "$FAMILIA_WORKER")
          echo "Revisiones nuevas: ${api##*/} y ${worker##*/}"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"

      - name: Actualizar los servicios
        env:
          ARN_API: ${{ steps.revisiones.outputs.api }}
          ARN_WORKER: ${{ steps.revisiones.outputs.worker }}
        run: |
          # Primer despliegue: Terraform crea api con 0 réplicas y CI la deja en 1 (infra §5.9). worker escala solo.
          deseadas=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$SERVICIO_API" \
            --query 'services[0].desiredCount' --output text)
          replicas=()
          if [ "$deseadas" = "0" ]; then
            echo "Primer despliegue: api pasa de 0 a 1 réplica."
            replicas=(--desired-count 1)
          fi
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$SERVICIO_API" \
            --task-definition "$ARN_API" "${replicas[@]}" --query service.serviceName --output text
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$SERVICIO_WORKER" \
            --task-definition "$ARN_WORKER" --query service.serviceName --output text

      - name: Esperar a que api quede estable
        env:
          ARN_API: ${{ steps.revisiones.outputs.api }}
        run: |
          if ! aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$SERVICIO_API"; then
            echo "::error::api no quedó estable en 10 min. Revisa los eventos del servicio y /campus-locator/dev/api."
            exit 1
          fi
          # Tras services-stable, la revisión PRIMARY debe ser la nueva y estar COMPLETED: si el circuit breaker hizo
          # rollback, el servicio también queda «estable», pero con la revisión anterior (backend §4.2).
          for _ in $(seq 1 12); do
            # shellcheck disable=SC2016 # las comillas invertidas son de JMESPath, no del shell
            primario=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$SERVICIO_API" --output text \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0].[taskDefinition, rolloutState, runningCount, desiredCount]')
            read -r revision estado corriendo deseadas <<< "$primario"
            echo "PRIMARY=${revision##*/} rollout=$estado tareas=$corriendo/$deseadas"
            if [ "$revision" != "$ARN_API" ]; then
              echo "::error::El despliegue de ${ARN_API##*/} se revirtió (circuit breaker). Revisa /campus-locator/dev/api."
              exit 1
            fi
            if [ "$estado" = "COMPLETED" ] && [ "$corriendo" = "$deseadas" ]; then
              echo "api estable con ${ARN_API##*/}."
              exit 0
            fi
            if [ "$estado" = "FAILED" ]; then
              echo "::error::El despliegue de ${ARN_API##*/} falló."
              exit 1
            fi
            sleep 10
          done
          echo "::error::api quedó estable, pero su despliegue no llegó a COMPLETED en 2 min."
          exit 1
